<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>ArcGIS Maps SDK for JavaScript Tutorials: Display a map</title>

    <style>
      html, body {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
      arcgis-map {
        display: block;
        height: 100vh; /* Full height */
        width: 100vw;
      }
      
    </style>

    <script>
      var esriConfig = {
        apiKey: "AAPTxy8BH1VEsoebNVZXo8HurCUGQrXu3erpYf0aHrvNXlY2k_bHzGoRbEOMeM4CovQLQ4_5TDEXRExKbeJ3G1gzUztP-y2kZBZaQAZUTxjwO3XIGYBNBBQ9fCXGLyy2xrH6UWabeLBjzxxsTVZkajEazOjaXx1a4u-FDW1L_zcutIqIe397yc7pDNGcyPJoFXHCwbaZkZ1amHxvnMRDfu2hMnE36f1fM8rdhpbEEzSW_CE.AT1_2TyVjxUD"
      };
    </script>

    <!-- Load Calcite components from CDN -->
    <script type="module" src="https://js.arcgis.com/calcite-components/3.0.3/calcite.esm.js"></script>

    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <link rel="stylesheet" href="https://js.arcgis.com/4.32/esri/themes/light/main.css" />
    <script src="https://js.arcgis.com/4.32/"></script>

    <!-- Load Map components from CDN-->
    <script
      type="module"
      src="https://js.arcgis.com/map-components/4.32/arcgis-map-components.esm.js"
    ></script>

  </head>

  <body>

    <arcgis-map basemap="arcgis/topographic" center="-111.427031, 39.212335" zoom="7.5">

      <arcgis-zoom position="top-left"></arcgis-zoom>

    </arcgis-map>
    <script>
    require(["esri/layers/FeatureLayer"], (FeatureLayer) => {
      
      const arcgisMap = document.querySelector("arcgis-map");
      
      arcgisMap.addEventListener("arcgisViewReadyChange", (event) => {
        const view = event.target.view;

        if (!view) return;

        // Canyon pin feature layer (points)
        const canyonLayer0 = new FeatureLayer({
          url: "https://services.arcgis.com/FvF9MZKp3JWPrSkg/arcgis/rest/services/Utah_Technical_Canyoneering_Routes/FeatureServer/1",
          popupTemplate: {
          title: "{Location}",
            content: "<b>Location:<b/> {Location}"
          }
        });

        arcgisMap.addLayer(canyonLayer0);

        // Canyon dot feature layer (points)
        const canyonLayer1 = new FeatureLayer({
          url: "https://services.arcgis.com/FvF9MZKp3JWPrSkg/arcgis/rest/services/Utah_Technical_Canyoneering_Routes/FeatureServer/2"
        });

        arcgisMap.addLayer(canyonLayer1);

        // Canyon route layer (lines)
        const parksLayer = new FeatureLayer({
          url: "https://services.arcgis.com/FvF9MZKp3JWPrSkg/arcgis/rest/services/Utah_Technical_Canyoneering_Routes/FeatureServer/3"
        });

        arcgisMap.addLayer(parksLayer, 0);
      });

    });
    </script>

  </body>

</html>
